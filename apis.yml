name: CubeTree
description: 'CubeTree was an enterprise social collaboration software startup (founded 2008, Redwood City,
  California) offering a business social network with wikis, blogs, file sharing, and activity feeds. It
  was acquired by SuccessFactors in 2010 (deal valued up to $50M) and folded into the SuccessFactors
  Business Alignment suite; SAP subsequently acquired SuccessFactors in 2012 and the product was absorbed
  into SAP SuccessFactors / SAP Jam. CubeTree no longer operates as an independent company: the cubetree.com
  domain is parked under SAP nameservers with no live web presence, developer portal, documentation, or API.
  Surfaced as a trinity-ventures portfolio company; retained as a historical/defunct network record with no
  enrichable API surface.'
